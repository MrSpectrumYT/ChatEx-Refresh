name: ChatEx-Refresh
main: de.jeter.chatex.ChatEx
version: ${project.version}
license: GPL-2.0
authors: [Jeter, Wizard_x, MrSpectrumYT]
description: "ChatEx-Refresh — a fork of the ChatEx plugin. Based on the original ChatEx by TheJeterLP. Additional original contribution: Wizard_x."
softdepend: [LuckPerms, PlaceholderAPI]
api-version: 1.13
folia-supported: true

commands:
  chatex:
    description: The main command of the plugin
    aliases: [chat]
  color:
    description: Set your personal chat color
    aliases: [chatcolor, msgcolor]

permissions:
  chatex.allowchat:
    description: Permission to use chat
    default: true
  chatex.chat.global:
    description: Permission to use global chat if ranged mode enabled
    default: op
  chatex.mention:
    description: Permission to mention other players with sound
    default: op
  chatex.chat.colorlegacy:
    description: Permission to use legacy colors
    default: op
  chatex.chat.colormodifier:
    description: Permission to use formatting codes
    default: op
  chatex.chat.colorhex:
    description: Permission to use HEX colors
    default: op
  chatex.chat.colormagic:
    description: "Permission to use magic color (&k)"
    default: op
  chatex.chat.colorgradient:
    description: Permission to use gradient colors in /color
    default: op
  сhatex.chat.color:
    description: "All color permissions (legacy + HEX + gradient + magic)"
    default: op
    children:
      chatex.chat.colorlegacy: true
      chatex.chat.colormodifier: true
      chatex.chat.colorhex: true
      chatex.chat.colormagic: true
  chatex.chat.minimessagelegacy:
    description: "Permission to use MiniMessage color tags like <red>"
    default: op
  chatex.chat.minimessagemodifier:
    description: "Permission to use MiniMessage bold/italic/underlined/strikethrough/reset tags"
    default: op
  chatex.chat.minimessagehex:
    description: "Permission to use MiniMessage HEX color tags like <#FFAA00>"
    default: op
  chatex.chat.minimessagemagic:
    description: "Permission to use MiniMessage <obfuscated> tag"
    default: op
  chatex.chat.minimessagegradient:
    description: "Permission to use MiniMessage <gradient> tag"
    default: op
  chatex.chat.minimessagerainbow:
    description: "Permission to use MiniMessage <rainbow> tag"
    default: op
  chatex.chat.minimessageurl:
    description: "Permission to use <click:open_url> (links)"
    default: op
  chatex.chat.minimessagesuggest:
    description: "Permission to use <click:suggest_command>"
    default: op
  chatex.chat.minimessagecommand:
    description: "Permission to use <click:run_command> (dangerous!)"
    default: op
  chatex.chat.minimessagecopy:
    description: "Permission to use <click:copy_to_clipboard>"
    default: op
  chatex.chat.minimessagehover:
    description: "Permission to use <hover:show_text>"
    default: op
  chatex.chat.minimessageinsertion:
    description: "Permission to use <insertion>"
    default: op
  chatex.chat.minimessagekeybind:
    description: "Permission to use <key> keybind tag"
    default: op
  chatex.chat.minimessagefont:
    description: "Permission to use <font> tag"
    default: op
  chatex.chat.minimessagelang:
    description: "Permission to use <lang> translatable tag"
    default: op
  chatex.chat.minimessagenewline:
    description: "Permission to use <newline> tag"
    default: op
  chatex.chat.minimessage:
    description: All MiniMessage permissions
    default: op
    children:
      chatex.chat.minimessagelegacy: true
      chatex.chat.minimessagemodifier: true
      chatex.chat.minimessagehex: true
      chatex.chat.minimessagemagic: true
      chatex.chat.minimessagegradient: true
      chatex.chat.minimessagerainbow: true
      chatex.chat.minimessageurl: true
      chatex.chat.minimessagesuggest: true
      chatex.chat.minimessagecommand: true
      chatex.chat.minimessagecopy: true
      chatex.chat.minimessagehover: true
      chatex.chat.minimessageinsertion: true
      chatex.chat.minimessagekeybind: true
      chatex.chat.minimessagefont: true
      chatex.chat.minimessagelang: true
      chatex.chat.minimessagenewline: true
  chatex.antispam.bypass:
    description: Permission to bypass the antispam system
    default: op
  chatex.bypassads:
    description: Permission to bypass the AdBlocker
    default: op
  chatex.notifyad:
    description: Permission to be messaged when a player tries to advertise
    default: op
  chatex.notifyupdate:
    description: Permission to get notiefied about new updates when you join
    default: op
  chatex.clear:
    description: Permission to use /chatex clear to clear the chat
    default: op
  chatex.color:
    description: Permission to use /color to change color of chat
    default: op
  chatex.reload:
    description: Permission to use /chatex reload to reload the config, messages and userdata
    default: op