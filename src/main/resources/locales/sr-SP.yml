  Color:
    PersonalActive: '&fИмате личну боју чета, тако да не можете да користите боје или форматирање текста у чету! Користите <hover:show_text:''<#9B2D30>Кликните да бисте ресетовали боју чета''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r да бисте је уклонили.'
    Usage: |-
      &f&fУпотреба обојеног чета:
      &f● <hover:show_text:'&#F34723Предложи пример legacy боје'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— постави legacy боју.
      &f● <hover:show_text:'&#F34723Предложи пример №1 HEX боје'><click:suggest_command:'/color &#FFAA00'>&#F34723/color &#F34723&&#F34723#&#F34723HEXHEX</click></hover>&r &f— постави HEX боју.
      &f● <hover:show_text:'&#F34723Предложи пример №2 HEX боје'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— постави HEX боју.
      &f● <hover:show_text:'&#F34723Предложи пример HEX градијента'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— постави HEX градијент.
      &f● <hover:show_text:'&#F34723Предложи пример legacy градијента'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— постави legacy градијент.
      &f● <hover:show_text:'&#F34723Кликните да бисте ресетовали личну боју'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— ресетујте своју боју.
      &f
      &fПриликом постављања било које боје, модификатори (нпр. &#F34723&&#F34723l&r&f) се постављају после боје без зареза или размака; код градијента, само после последње боје!
      &f
