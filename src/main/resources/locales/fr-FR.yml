  Color:
    PersonalActive: '&fVous avez une couleur de chat personnelle, vous ne pouvez donc pas utiliser de couleurs ou de formatage de texte dans le chat ! Utilisez <hover:show_text:''<#9B2D30>Cliquez pour réinitialiser votre couleur de chat''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r pour la supprimer.'
    Usage: |-
      &f&fUtilisation du chat coloré :
      &f● <hover:show_text:'&#F34723Suggérer un exemple de couleur legacy'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— définir une couleur legacy.
      &f● <hover:show_text:'&#F34723Suggérer un exemple de couleur HEX №1'><click:suggest_command:'/color &#FFAA00'>&#F34723/color &#F34723&&#F34723#&#F34723HEXHEX</click></hover>&r &f— définir une couleur HEX.
      &f● <hover:show_text:'&#F34723Suggérer un exemple de couleur HEX №2'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— définir une couleur HEX.
      &f● <hover:show_text:'&#F34723Suggérer un exemple de dégradé HEX'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— définir un dégradé HEX.
      &f● <hover:show_text:'&#F34723Suggérer un exemple de dégradé legacy'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— définir un dégradé legacy.
      &f● <hover:show_text:'&#F34723Cliquez pour réinitialiser la couleur personnelle'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— réinitialiser votre couleur.
      &f
      &fLors de la définition d''une couleur, les modificateurs (ex. &#F34723&&#F34723l&r&f) sont placés après la couleur sans virgules ni espaces ; avec un dégradé, uniquement après la dernière couleur !
      &f
    Set: '&fVotre couleur de chat a été mise à jour !'
