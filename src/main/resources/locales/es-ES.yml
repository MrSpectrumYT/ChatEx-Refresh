    PersonalActive: '&fTienes un color de chat personal, así que no puedes usar colores ni formato de texto en el chat. Usa <hover:show_text:''<#9B2D30>Haz clic para restablecer tu color de chat''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r para eliminarlo.'
    Usage: |-
      &f&fUso para chat con color:
      &f● <hover:show_text:'&#F34723Sugerir un ejemplo de color legacy'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— establecer un color legacy.
      &f● <hover:show_text:'&#F34723Sugerir un ejemplo de color HEX №1'><click:suggest_command:'/color &#FFAA00'>&#F34723/color &#F34723&&#F34723#&#F34723HEXHEX</click></hover>&r &f— establecer un color HEX.
      &f● <hover:show_text:'&#F34723Sugerir un ejemplo de color HEX №2'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— establecer un color HEX.
      &f● <hover:show_text:'&#F34723Sugerir un ejemplo de degradado HEX'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— establecer un degradado HEX.
      &f● <hover:show_text:'&#F34723Sugerir un ejemplo de degradado legacy'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— establecer un degradado legacy.
      &f● <hover:show_text:'&#F34723Haz clic para restablecer el color personal'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— restablecer tu color.
      &f
      &fAl establecer cualquier color, los modificadores (ej. &#F34723&&#F34723l&r&f) se colocan después del color sin comas ni espacios; con un degradado, ¡solo después del último color!
      &f
