  Color:
    PersonalActive: '&fУ вас ёсць асабісты колер чату, таму вы не можаце выкарыстоўваць колеры ці фарматаванне тэксту ў чаце! Выкарыстайце <hover:show_text:''<#9B2D30>Націсніце, каб скінуць колер чату''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r, каб выдаліць яго.'
    Usage: |-
      &f&fВыкарыстанне каляровага чату:
      &f● <hover:show_text:'&#F34723Прапанаваць прыклад legacy-колеру'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— усталяваць legacy-колер.
      &f● <hover:show_text:'&#F34723Прапанаваць прыклад №1 HEX-колеру'><click:suggest_command:'/color &#FFAA00'>&#F34723/color &#F34723&&#F34723#&#F34723HEXHEX</click></hover>&r &f— усталяваць HEX-колер.
      &f● <hover:show_text:'&#F34723Прапанаваць прыклад №2 HEX-колеру'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— усталяваць HEX-колер.
      &f● <hover:show_text:'&#F34723Прапанаваць прыклад HEX-градыенту'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— усталяваць HEX-градыент.
      &f● <hover:show_text:'&#F34723Прапанаваць прыклад legacy-градыенту'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— усталяваць legacy-градыент.
      &f● <hover:show_text:'&#F34723Націсніце, каб скінуць асабісты колер'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— скінуць ваш колер.
      &f
      &fПры ўсталяванні любога колеру мадыфікатары (напр. &#F34723&&#F34723l&r&f) ставяцца пасля колеру без коскі ці прабелу; пры градыенце — толькі пасля апошняга колеру!
      &f
    Set: '&fВаш колер чату абноўлены!'
