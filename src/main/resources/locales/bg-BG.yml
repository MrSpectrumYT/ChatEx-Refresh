  Color:
    PersonalActive: '&fИмате личен цвят за чата, така че не можете да използвате цветове или форматиране на текста в чата! Използвайте <hover:show_text:''<#9B2D30>Кликнете, за да нулирате цвета на чата''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r, за да го премахнете.'
    Usage: |-
      &f&fУпотреба за цветен чат:
      &f● <hover:show_text:'&#F34723Предложи примерен legacy цвят'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— задайте legacy цвят.
      &f● <hover:show_text:'&#F34723Предложи примерен №1 HEX цвят'><click:suggest_command:'/color &#FFAA00'>&#F34723/color &#F34723&&#F34723#&#F34723HEXHEX</click></hover>&r &f— задайте HEX цвят.
      &f● <hover:show_text:'&#F34723Предложи примерен №2 HEX цвят'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— задайте HEX цвят.
      &f● <hover:show_text:'&#F34723Предложи примерен HEX градиент'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— задайте HEX градиент.
      &f● <hover:show_text:'&#F34723Предложи примерен legacy градиент'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— задайте legacy градиент.
      &f● <hover:show_text:'&#F34723Кликнете, за да нулирате личния цвят'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— нулирайте цвета си.
      &f
      &fПри задаване на цвят модификаторите (напр. &#F34723&&#F34723l&r&f) се поставят след цвета без запетаи или интервали; при градиент — само след последния цвят!
      &f
