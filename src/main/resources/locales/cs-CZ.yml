    PersonalActive: '&fMáte osobní barvu chatu, takže nemůžete v chatu používat barvy ani formátování textu! Použijte <hover:show_text:''<#9B2D30>Kliknutím resetujete barvu chatu''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r pro její odstranění.'
    Usage: |-
      &f&fPoužití barevného chatu:
      &f● <hover:show_text:'&#F34723Navrhnout příklad legacy barvy'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— nastavit legacy barvu.
      &f● <hover:show_text:'&#F34723Navrhnout příklad №1 HEX barvy'><click:suggest_command:'/color &#FFAA00'>&#F34723/color &#F34723&&#F34723#&#F34723HEXHEX</click></hover>&r &f— nastavit HEX barvu.
      &f● <hover:show_text:'&#F34723Navrhnout příklad №2 HEX barvy'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— nastavit HEX barvu.
      &f● <hover:show_text:'&#F34723Navrhnout příklad HEX přechodu'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— nastavit HEX přechod.
      &f● <hover:show_text:'&#F34723Navrhnout příklad legacy přechodu'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— nastavit legacy přechod.
      &f● <hover:show_text:'&#F34723Kliknutím resetujete osobní barvu'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— resetovat vaši barvu.
      &f
      &fPři nastavování barvy se modifikátory (např. &#F34723&&#F34723l&r&f) umísťují za barvu bez čárek nebo mezer; u přechodu pouze za poslední barvu!
      &f
