      &f● <hover:show_text:'&#F34723Намунаи №2 ранги HEX-ро пешниҳод кунед'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— ранги HEX-ро танзим кунед.
      &f● <hover:show_text:'&#F34723Намунаи градиенти HEX-ро пешниҳод кунед'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— градиенти HEX-ро танзим кунед.
      &f● <hover:show_text:'&#F34723Намунаи градиенти legacy-ро пешниҳод кунед'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— градиенти legacy-ро танзим кунед.
      &f● <hover:show_text:'&#F34723Барои аз нав танзим кардани ранги шахсӣ клик кунед'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— ранги худро аз нав танзим кунед.
      &f
      &fҲангоми танзими ягон ранг, модификаторҳо (масалан, &#F34723&&#F34723l&r&f) баъд аз ранг бе вергул ё фосила ҷойгир мешаванд; дар градиент танҳо баъд аз ранги охирин!
