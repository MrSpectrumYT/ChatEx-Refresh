      &f&fИстифодаи чати рангин:
      &f● <hover:show_text:'&#F34723Намунаи ранги legacy-ро пешниҳод кунед'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— ранги legacy-ро танзим кунед.
