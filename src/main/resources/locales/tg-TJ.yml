    PersonalActive: '&fШумо ранги шахсии чат доред, бинобар ин шумо наметавонед рангҳо ё форматкунии матнро дар чат истифода баред! Барои нест кардани он <hover:show_text:''<#9B2D30>Барои аз нав танзим кардани ранги чат клик кунед''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r-ро истифода баред.'
