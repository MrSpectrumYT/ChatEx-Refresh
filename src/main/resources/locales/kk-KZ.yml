    PersonalActive: '&fСізде жеке чат түсі бар, сондықтан чатта түстерді немесе мәтінді форматтауды қолдана алмайсыз! Оны жою үшін <hover:show_text:''<#9B2D30>Чат түсін қалпына келтіру үшін басыңыз''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r қолданыңыз.'
