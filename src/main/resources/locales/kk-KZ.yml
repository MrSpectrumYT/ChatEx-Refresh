      &f● <hover:show_text:'&#F34723HEX градиент үлгісін ұсыну'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— HEX градиент орнату.
      &f● <hover:show_text:'&#F34723Legacy градиент үлгісін ұсыну'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— legacy градиент орнату.
      &f● <hover:show_text:'&#F34723Жеке түсті қалпына келтіру үшін басыңыз'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— түсіңізді қалпына келтіріңіз.
