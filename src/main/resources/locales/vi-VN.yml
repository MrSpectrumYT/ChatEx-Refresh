  Color:
    PersonalActive: '&fBạn có màu chat cá nhân, vì vậy bạn không thể sử dụng màu sắc hoặc định dạng văn bản trong chat! Hãy dùng <hover:show_text:''<#9B2D30>Nhấp để đặt lại màu chat của bạn''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r để xóa nó.'
    Usage: |-
      &f&fCách sử dụng chat màu:
      &f● <hover:show_text:'&#F34723Gợi ý ví dụ màu legacy'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— đặt màu legacy.
      &f● <hover:show_text:'&#F34723Gợi ý ví dụ màu HEX №1'><click:suggest_command:'/color &#FFAA00'>&#F34723/color &#F34723&&#F34723#&#F34723HEXHEX</click></hover>&r &f— đặt màu HEX.
      &f● <hover:show_text:'&#F34723Gợi ý ví dụ màu HEX №2'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— đặt màu HEX.
      &f● <hover:show_text:'&#F34723Gợi ý ví dụ chuyển sắc HEX'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— đặt chuyển sắc HEX.
      &f● <hover:show_text:'&#F34723Gợi ý ví dụ chuyển sắc legacy'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— đặt chuyển sắc legacy.
      &f● <hover:show_text:'&#F34723Nhấp để đặt lại màu cá nhân'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— đặt lại màu của bạn.
      &f
      &fKhi đặt bất kỳ màu nào, các bổ ngữ (ví dụ: &#F34723&&#F34723l&r&f) được đặt sau màu mà không có dấu phẩy hoặc dấu cách; với chuyển sắc, chỉ sau màu cuối cùng!
      &f
