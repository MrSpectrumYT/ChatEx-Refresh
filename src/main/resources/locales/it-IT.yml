    Usage: |-
      &f&fUtilizzo della chat colorata:
      &f● <hover:show_text:'&#F34723Suggerisci un esempio di colore legacy'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— imposta un colore legacy.
      &f● <hover:show_text:'&#F34723Suggerisci un esempio di colore HEX №1'><click:suggest_command:'/color &#FFAA00'>&#F34723/color &#F34723&&#F34723#&#F34723HEXHEX</click></hover>&r &f— imposta un colore HEX.
      &f● <hover:show_text:'&#F34723Suggerisci un esempio di colore HEX №2'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— imposta un colore HEX.
      &f● <hover:show_text:'&#F34723Suggerisci un esempio di gradiente HEX'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— imposta un gradiente HEX.
      &f● <hover:show_text:'&#F34723Suggerisci un esempio di gradiente legacy'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— imposta un gradiente legacy.
      &f● <hover:show_text:'&#F34723Clicca per reimpostare il colore personale'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— reimposta il tuo colore.
      &f
      &fQuando imposti un colore, i modificatori (es. &#F34723&&#F34723l&r&f) vanno dopo il colore senza virgole o spazi; con un gradiente, solo dopo l''ultimo colore!
      &f
