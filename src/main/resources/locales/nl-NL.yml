      &f● <hover:show_text:'&#F34723Stel een voorbeeld HEX-gradiënt voor'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— stel een HEX-gradiënt in.
      &f● <hover:show_text:'&#F34723Stel een voorbeeld legacy gradiënt voor'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— stel een legacy gradiënt in.
      &f● <hover:show_text:'&#F34723Klik om persoonlijke kleur te resetten'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— reset je kleur.
