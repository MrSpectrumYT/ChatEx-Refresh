  Color:
    PersonalActive: '&fУ вас є особистий колір чату, тому ви не можете використовувати кольори або форматування тексту в чаті! Використайте <hover:show_text:''<#9B2D30>Натисніть, щоб скинути колір чату''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r, щоб прибрати його.'
    Usage: |-
      &f&fВикористання кольорового чату:
      &f● <hover:show_text:'&#F34723Запропонувати приклад legacy-кольору'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— встановити legacy-колір.
      &f● <hover:show_text:'&#F34723Запропонувати приклад №1 HEX-кольору'><click:suggest_command:'/color &#FFAA00'>&#F34723/color &#F34723&&#F34723#&#F34723HEXHEX</click></hover>&r &f— встановити HEX-колір.
      &f● <hover:show_text:'&#F34723Запропонувати приклад №2 HEX-кольору'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— встановити HEX-колір.
      &f● <hover:show_text:'&#F34723Запропонувати приклад HEX-градієнта'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— встановити HEX-градієнт.
      &f● <hover:show_text:'&#F34723Запропонувати приклад legacy-градієнта'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— встановити legacy-градієнт.
      &f● <hover:show_text:'&#F34723Натисніть, щоб скинути особистий колір'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— скинути ваш колір.
      &f
      &fПід час встановлення будь-якого кольору модифікатори (напр. &#F34723&&#F34723l&r&f) ставляться після кольору без ком або пробілів; при градієнті — лише після останнього кольору!
      &f
