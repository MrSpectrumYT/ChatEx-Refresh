  Color:
    PersonalActive: '&fAi o culoare personală de chat, așa că nu poți folosi culori sau formatarea textului în chat! Folosește <hover:show_text:''<#9B2D30>Click pentru a reseta culoarea chatului''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r pentru a o elimina.'
    Usage: |-
      &f&fUtilizare pentru chat colorat:
      &f● <hover:show_text:'&#F34723Sugerează un exemplu de culoare legacy'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— setează o culoare legacy.
      &f● <hover:show_text:'&#F34723Sugerează un exemplu №1 de culoare HEX'><click:suggest_command:'/color &#FFAA00'>&#F34723/color &#F34723&&#F34723#&#F34723HEXHEX</click></hover>&r &f— setează o culoare HEX.
      &f● <hover:show_text:'&#F34723Sugerează un exemplu №2 de culoare HEX'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— setează o culoare HEX.
      &f● <hover:show_text:'&#F34723Sugerează un exemplu de gradient HEX'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— setează un gradient HEX.
      &f● <hover:show_text:'&#F34723Sugerează un exemplu de gradient legacy'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— setează un gradient legacy.
      &f● <hover:show_text:'&#F34723Click pentru a reseta culoarea personală'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— resetează-ți culoarea.
      &f
      &fCând setați orice culoare, modificatorii (ex. &#F34723&&#F34723l&r&f) sunt plasați după culoare fără virgule sau spații; la un gradient, doar după ultima culoare!
      &f
