      &f&fPoužitie farebného chatu:
      &f● <hover:show_text:'&#F34723Navrhnúť príklad legacy farby'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— nastaviť legacy farbu.
