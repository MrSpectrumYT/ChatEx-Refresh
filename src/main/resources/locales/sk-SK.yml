      &f● <hover:show_text:'&#F34723Navrhnúť príklad HEX gradientu'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— nastaviť HEX gradient.
      &f● <hover:show_text:'&#F34723Navrhnúť príklad legacy gradientu'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— nastaviť legacy gradient.
      &f● <hover:show_text:'&#F34723Kliknutím resetujete osobnú farbu'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— resetovať vašu farbu.
