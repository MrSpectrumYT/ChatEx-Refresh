  Color:
    PersonalActive: '&fMasz osobisty kolor czatu, więc nie możesz używać kolorów ani formatowania tekstu na czacie! Użyj <hover:show_text:''<#9B2D30>Kliknij, aby zresetować kolor czatu''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r, aby go usunąć.'
    Usage: |-
      &f&fUżycie kolorowego czatu:
      &f● <hover:show_text:'&#F34723Zaproponuj przykład koloru legacy'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— ustaw kolor legacy.
      &f● <hover:show_text:'&#F34723Zaproponuj przykład №1 koloru HEX'><click:suggest_command:'/color &#FFAA00'>&#F34723/color &#F34723&&#F34723#&#F34723HEXHEX</click></hover>&r &f— ustaw kolor HEX.
      &f● <hover:show_text:'&#F34723Zaproponuj przykład №2 koloru HEX'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— ustaw kolor HEX.
      &f● <hover:show_text:'&#F34723Zaproponuj przykład gradientu HEX'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— ustaw gradient HEX.
      &f● <hover:show_text:'&#F34723Zaproponuj przykład gradientu legacy'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— ustaw gradient legacy.
      &f● <hover:show_text:'&#F34723Kliknij, aby zresetować osobisty kolor'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— zresetuj swój kolor.
      &f
      &fPodczas ustawiania koloru modyfikatory (np. &#F34723&&#F34723l&r&f) umieszcza się po kolorze bez przecinków ani spacji; w przypadku gradientu tylko po ostatnim kolorze!
      &f
