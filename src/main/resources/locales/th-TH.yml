  Color:
    PersonalActive: '&fคุณมีสีแชทส่วนตัว ดังนั้นคุณจึงไม่สามารถใช้สีหรือการจัดรูปแบบข้อความในแชทได้! ใช้ <hover:show_text:''<#9B2D30>คลิกเพื่อรีเซ็ตสีแชทของคุณ''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r เพื่อลบมัน'
    Usage: |-
      &f&fวิธีใช้แชทสี:
      &f● <hover:show_text:'&#F34723แนะนำตัวอย่างสี legacy'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— ตั้งสี legacy
      &f● <hover:show_text:'&#F34723แนะนำตัวอย่างสี HEX №1'><click:suggest_command:'/color &#FFAA00'>&#F34723/color &#F34723&&#F34723#&#F34723HEXHEX</click></hover>&r &f— ตั้งสี HEX
      &f● <hover:show_text:'&#F34723แนะนำตัวอย่างสี HEX №2'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— ตั้งสี HEX
      &f● <hover:show_text:'&#F34723แนะนำตัวอย่างการไล่ระดับสี HEX'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— ตั้งการไล่ระดับสี HEX
      &f● <hover:show_text:'&#F34723แนะนำตัวอย่างการไล่ระดับสี legacy'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— ตั้งการไล่ระดับสี legacy
      &f● <hover:show_text:'&#F34723คลิกเพื่อรีเซ็ตสีส่วนตัว'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— รีเซ็ตสีของคุณ
      &f
      &fเมื่อตั้งค่าสีใดๆ ตัวปรับแต่ง (เช่น &#F34723&&#F34723l&r&f) จะถูกวางไว้หลังสีโดยไม่มีเครื่องหมายจุลภาคหรือช่องว่าง สำหรับการไล่ระดับสี จะวางหลังสีสุดท้ายเท่านั้น!
      &f
