  Color:
    PersonalActive: '&fDu hast eine persönliche Chatfarbe, daher kannst du keine Farben oder Textformatierungen im Chat verwenden! Benutze <hover:show_text:''<#9B2D30>Klicke, um deine Chatfarbe zurückzusetzen''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r, um sie zu entfernen.'
    Usage: |-
      &f&fVerwendung für farbigen Chat:
      &f● <hover:show_text:'&#F34723Beispiel für Legacy-Farbe vorschlagen'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— setze eine Legacy-Farbe.
      &f● <hover:show_text:'&#F34723Beispiel №1 für HEX-Farbe vorschlagen'><click:suggest_command:'/color &#FFAA00'>&#F34723/color &#F34723&&#F34723#&#F34723HEXHEX</click></hover>&r &f— setze eine HEX-Farbe.
      &f● <hover:show_text:'&#F34723Beispiel №2 für HEX-Farbe vorschlagen'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— setze eine HEX-Farbe.
      &f● <hover:show_text:'&#F34723Beispiel für HEX-Verlauf vorschlagen'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— setze einen HEX-Verlauf.
      &f● <hover:show_text:'&#F34723Beispiel für Legacy-Verlauf vorschlagen'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— setze einen Legacy-Verlauf.
      &f● <hover:show_text:'&#F34723Klicke, um persönliche Farbe zurückzusetzen'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— setze deine Farbe zurück.
      &f
      &fBeim Setzen einer Farbe werden Modifikatoren (z.B. &#F34723&&#F34723l&r&f) nach der Farbe ohne Kommas oder Leerzeichen platziert; bei einem Verlauf nur nach der letzten Farbe!
      &f
