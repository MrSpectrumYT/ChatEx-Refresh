      &f● <hover:show_text:'&#F34723Örnek legacy gradyanı öner'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— legacy gradyanı ayarla.
