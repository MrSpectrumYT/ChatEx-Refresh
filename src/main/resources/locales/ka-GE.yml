  Color:
    PersonalActive: '&fთქვენ გაქვთ პირადი ჩატის ფერი, ამიტომ ვერ გამოიყენებთ ფერებს ან ტექსტის ფორმატირებას ჩატში! გამოიყენეთ <hover:show_text:''<#9B2D30>დააჭირე ჩატის ფერის გასუფთავებას''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r მის მოსაშორებლად.'
    Usage: |-
      &f&fფერადი ჩატის გამოყენება:
      &f● <hover:show_text:'&#F34723შემოგვთავაზე ლეგასი ფერის მაგალითი'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— დააყენე ლეგასი ფერი.
      &f● <hover:show_text:'&#F34723შემოგვთავაზე №1 HEX ფერის მაგალითი'><click:suggest_command:'/color &#FFAA00'>&#F34723/color &#F34723&&#F34723#&#F34723HEXHEX</click></hover>&r &f— დააყენე HEX ფერი.
      &f● <hover:show_text:'&#F34723შემოგვთავაზე №2 HEX ფერის მაგალითი'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— დააყენე HEX ფერი.
      &f● <hover:show_text:'&#F34723შემოგვთავაზე HEX გრადიენტის მაგალითი'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— დააყენე HEX გრადიენტი.
      &f● <hover:show_text:'&#F34723შემოგვთავაზე ლეგასი გრადიენტის მაგალითი'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— დააყენე ლეგასი გრადიენტი.
      &f● <hover:show_text:'&#F34723დააჭირე პირადი ფერის გასუფთავებას'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— გაასუფთავე შენი ფერი.
      &f
      &fნებისმიერი ფერის დაყენებისას, მოდიფიკატორები (მაგ. &#F34723&&#F34723l&r&f) იდება ფერის შემდეგ მძიმის ან სივრცის გარეშე; გრადიენტის შემთხვევაში, მხოლოდ ბოლო ფერის შემდეგ!
      &f
