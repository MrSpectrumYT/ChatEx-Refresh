      &f● <hover:show_text:'&#F34723Sugerir um exemplo de gradiente HEX'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— definir um gradiente HEX.
