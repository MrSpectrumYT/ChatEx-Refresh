    PersonalActive: '&fСизде жеке чат түсү бар, ошондуктан чатта түстөрдү же текст форматтоосун колдонo албайсыз! Аны жоюу үчүн <hover:show_text:''<#9B2D30>Чат түсүн баштапкы абалга келтирүү үчүн басыңыз''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r колдонуңуз.'
    Usage: |-
      &f&fТүстүү чатты колдонуу:
      &f● <hover:show_text:'&#F34723Legacy түс үлгүсүн сунуштоо'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— legacy түс коюу.
      &f● <hover:show_text:'&#F34723№1 HEX түс үлгүсүн сунуштоо'><click:suggest_command:'/color &#FFAA00'>&#F34723/color &#F34723&&#F34723#&#F34723HEXHEX</click></hover>&r &f— HEX түс коюу.
      &f● <hover:show_text:'&#F34723№2 HEX түс үлгүсүн сунуштоо'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— HEX түс коюу.
      &f● <hover:show_text:'&#F34723HEX градиент үлгүсүн сунуштоо'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— HEX градиент коюу.
      &f● <hover:show_text:'&#F34723Legacy градиент үлгүсүн сунуштоо'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— legacy градиент коюу.
      &f● <hover:show_text:'&#F34723Жеке түстү баштапкы абалга келтирүү үчүн басыңыз'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— түсүңүздү баштапкы абалга келтириңиз.
      &f
      &fКаалаган түстү коюуда, модификаторлор (мис. &#F34723&&#F34723l&r&f) үтүрсүз же боштуксуз түстөн кийин коюлат; градиентте акыркы түстөн кийин гана!
      &f
