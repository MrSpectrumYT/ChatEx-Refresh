    PersonalActive: '&fУ вас есть личный цвет чата, поэтому вы не можете использовать цвета или форматирование текста в чате! Используйте <hover:show_text:''<#9B2D30>Нажмите, чтобы сбросить цвет чата''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r, чтобы убрать его.'
    Usage: |-
      &f&fИспользование цветного чата:
      &f● <hover:show_text:'&#F34723Предложить пример legacy-цвета'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— установить legacy-цвет.
      &f● <hover:show_text:'&#F34723Предложить пример №1 HEX-цвета'><click:suggest_command:'/color &#FFAA00'>&#F34723/color &#F34723&&#F34723#&#F34723HEXHEX</click></hover>&r &f— установить HEX-цвет.
      &f● <hover:show_text:'&#F34723Предложить пример №2 HEX-цвета'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— установить HEX-цвет.
      &f● <hover:show_text:'&#F34723Предложить пример HEX-градиента'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— установить HEX-градиент.
      &f● <hover:show_text:'&#F34723Предложить пример legacy-градиента'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— установить legacy-градиент.
      &f● <hover:show_text:'&#F34723Нажмите, чтобы сбросить личный цвет'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— сбросить ваш цвет.
      &f
      &fПри установке любого цвета модификаторы (например, &#F34723&&#F34723l&r&f) ставятся после цвета без запятых или пробелов; при градиенте — только после последнего цвета!
      &f
