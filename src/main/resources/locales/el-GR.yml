  Color:
    PersonalActive: '&fΈχετε προσωπικό χρώμα chat, επομένως δεν μπορείτε να χρησιμοποιήσετε χρώματα ή μορφοποίηση κειμένου στο chat! Χρησιμοποιήστε <hover:show_text:''<#9B2D30>Κάντε κλικ για επαναφορά του χρώματος chat''><click:run_command:''/color reset''><#9B2D30>/color reset</click></hover>&r για να το αφαιρέσετε.'
    Usage: |-
      &f&fΧρήση για χρωματιστό chat:
      &f● <hover:show_text:'&#F34723Προτείνετε ένα παράδειγμα legacy χρώματος'><click:suggest_command:'/color &9'>&#F34723/color &#F34723&&#F34723x</click></hover>&r &f— ορίστε ένα legacy χρώμα.
      &f● <hover:show_text:'&#F34723Προτείνετε ένα παράδειγμα №1 HEX χρώματος'><click:suggest_command:'/color &#FFAA00'>&#F34723/color &#F34723&&#F34723#&#F34723HEXHEX</click></hover>&r &f— ορίστε ένα HEX χρώμα.
      &f● <hover:show_text:'&#F34723Προτείνετε ένα παράδειγμα №2 HEX χρώματος'><click:suggest_command:'/color #00AAFF'>&#F34723/color &#F34723#&#F34723HEXHEX</click></hover>&r &f— ορίστε ένα HEX χρώμα.
      &f● <hover:show_text:'&#F34723Προτείνετε ένα παράδειγμα HEX διαβάθμισης'><click:suggest_command:'/color &#FF0000,#00FF00'>&#F34723/color &#F34723#&#F34723HEX1,&#F34723&&#F34723#&#F34723HEX2,...</click></hover>&r &f— ορίστε HEX διαβάθμιση.
      &f● <hover:show_text:'&#F34723Προτείνετε ένα παράδειγμα legacy διαβάθμισης'><click:suggest_command:'/color &4,&f'>&#F34723/color &#F34723&&#F34723x1,&#F34723&&#F34723x2,...</click></hover>&r &f— ορίστε legacy διαβάθμιση.
      &f● <hover:show_text:'&#F34723Κάντε κλικ για επαναφορά προσωπικού χρώματος'><click:run_command:'/color reset'>&#F34723/color reset</click></hover>&r &f— επαναφορά χρώματος.
      &f
      &fΚατά τον ορισμό οποιουδήποτε χρώματος, οι τροποποιητές (π.χ. &#F34723&&#F34723l&r&f) τοποθετούνται μετά το χρώμα χωρίς κόμματα ή κενά· στη διαβάθμιση, μόνο μετά το τελευταίο χρώμα!
      &f
